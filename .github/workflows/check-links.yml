name: check links
on:
  schedule:
    - cron: "0 6 1 * *"   # first of the month — domains go stale
  push:
    paths:
      - events.json
      - scripts/check-links.mjs
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-links.mjs
