name: validate events
on:
  push:
    paths:
      - events.json
      - index.html
      - sitemap.xml
      - scripts/validate.mjs
      - scripts/build-seo.mjs
  pull_request:
    paths:
      - events.json
      - index.html
      - sitemap.xml
      - scripts/validate.mjs
      - scripts/build-seo.mjs
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate.mjs
      # index.html's JSON-LD + no-JS list and sitemap.xml are generated from
      # events.json — fails if someone edited the data without regenerating
      - run: node scripts/build-seo.mjs --check
