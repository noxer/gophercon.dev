name: validate events
on:
  push:
    paths:
      - events.json
      - scripts/validate.mjs
  pull_request:
    paths:
      - events.json
      - scripts/validate.mjs
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate.mjs
